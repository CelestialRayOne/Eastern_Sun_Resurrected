name: Publish ESR release

on:
  push:
    branches: [main]
    paths:
      - 'Eastern_Sun_Resurrected.mpq/modinfo.json'
      - 'patchnotes/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout content repo
        uses: actions/checkout@v5
        with:
          path: content

      - name: Checkout launcher repo (private)
        uses: actions/checkout@v5
        with:
          repository: CelestialRayOne/Eastern_Sun_Resurrected_Launcher
          token: ${{ secrets.LAUNCHER_READ_TOKEN }}
          path: launcher

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build launcher + publisher
        working-directory: launcher
        run: dotnet build esr_launcher.sln -c Release

      - name: Read version from modinfo.json
        id: ver
        shell: pwsh
        run: |
          $modinfo = Get-Content 'content/Eastern_Sun_Resurrected.mpq/modinfo.json' -Raw | ConvertFrom-Json
          "version=$($modinfo.version)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Short-circuit if release already exists
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.ver.outputs.version }}"
          $null = gh release view $tag --repo $env:GITHUB_REPOSITORY 2>&1
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            Write-Host "Release $tag already exists. Nothing to do."
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Release $tag does not exist yet. Proceeding."
            "skip=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Run ESRPublish
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          launcher/src/ESRPublish/bin/Release/ESRPublish.exe `
            --input content `
            --launcher-exe launcher/src/ESRLauncher/bin/Release/ESRLauncher.exe `
            --publish
