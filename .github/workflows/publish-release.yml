name: Publish ESR release

on:
  push:
    branches: [main]
    paths:
      - 'd2rloader/metadata.json'
      - 'patchnotes/**'
  workflow_dispatch:

jobs:
  publish:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout content repo
        uses: actions/checkout@v5
        with:
          path: content

      - name: Checkout launcher repo (
        uses: actions/checkout@v5
        with:
          repository: CelestialRayOne/Eastern_Sun_Resurrected_Launcher
          token: ${{ secrets.LAUNCHER_READ_TOKEN }}
          path: launcher

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Build launcher + publisher
        working-directory: launcher
        run: dotnet build esr_launcher.sln -c Release

      - name: Read version from d2rloader/metadata.json
        id: ver
        shell: pwsh
        run: |
          $meta = Get-Content 'content/d2rloader/metadata.json' -Raw | ConvertFrom-Json
          $v = $meta.metadata.modVersion
          if ([string]::IsNullOrWhiteSodVersion missing ind2rloader/metadata.json" }
          "version=$($v.Trim())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Short-circuit if release
        id: check
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB
        run: |
          $tag = "${{ steps.ver.outputs.version }}"
          $null = gh release view $tagY 2>&1
          $exists = ($LASTEXITCODE -eq 0)
          $global:LASTEXITCODE = 0
          if ($exists) {
            Write-Host "Release $tag a"
            "skip=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Release $tag does not exist yet. Proceeding."
            "skip=false" | Out-File -Fppend
          }

      - name: Run ESRPublish
        if: steps.check.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          launcher/src/ESRPublish/bin/
            --input content `
            --launcher-exe launcher/srLauncher.exe `
            --publish