# Cube Clone Item
#
# Adds a cubemain.txt output code, cloneitem. The output is an exact duplicate
# of the item matched by input 1: same base item, quality, affixes, rolled
# values, sockets and socketed items. Nothing is rolled.
#
# Write it in the output, output b or output c column, in lowercase. Modifiers
# follow a comma, as with useitem:
#
#   cloneitem
#   cloneitem,rem
#
# Which item is copied
#   Always the item matched by input 1. The game binds input 1 to the outputs
#   only when output (A) is cloneitem, useitem or usetype, or carries mod. A
#   cloneitem in output b or output c therefore needs one of those in output
#   (A); otherwise that output produces nothing.
#
# The source item
#   Consumed like any other input. To keep the original and get a copy, put
#   useitem in output (A) and cloneitem in output b.
#
# Modifiers
#   Applied to the copy after it is made: uns, rem, rep, rch, sock=, qty= and
#   the mod 1 to mod 5 columns.
#   No effect, because nothing is rolled: pre=, suf=, lvl=, plvl=, ilvl=,
#   low, nor, hiq, mag, set, rar, uni, crf, tmp, eth, exc and eli.
#   reg turns the output into usetype, exactly as it does for useitem.
#   Do not combine with mod: mod rewrites the input 1 item in place and does
#   not know cloneitem.
#
# Console command: cloneitem reports whether the hooks are armed, how many
# cloneitem cells were parsed and how many copies were made.

[cube_cloneitem]

# Master switch. When false nothing is hooked and cloneitem is not a
# recognised output code, as in the unmodified game.
enabled = true
