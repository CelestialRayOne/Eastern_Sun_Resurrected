# Critical Strike Damage
#
# Scales the damage multiplier used when an attack rolls a critical or
# deadly strike. The engine resolves weapon-mastery Critical,
# passive_critical_strike (stat 337) and item_deadlystrike (stat 141)
# through one shared doubling block, so all three are covered here.

[critical_strike_damage]

# Master switch.
enabled = true

# itemstatcost.txt id carrying the bonus. The stat is a percentage that
# is ADDED to base_percent, so 50 turns a x2 critical into a x2.5.
stat_id = 434

# The vanilla critical multiplier, in percent. 200 = x2. Leave at 200
# unless you want to retune criticals for everyone, stat or no stat.
base_percent = 200

# Safety ceiling on (base_percent + stat), in percent.
max_percent = 100000

# Which critical sources the stat applies to. A disabled source keeps
# the vanilla x2 exactly. Leaving these mixed is usually a trap: the
# three sources are mutually exclusive and resolved in the order
# weapon mastery -> critical strike -> deadly strike, so disabling one
# means a character who has it loses the bonus the others would give.
apply_to_deadly_strike = true
apply_to_critical_strike = true
apply_to_weapon_mastery = true

# Ranged attacks. Missiles roll their critical once at creation and only
# carry a yes/no flag to impact, so the engine itself discards which of
# the three sources won. The three toggles above therefore cannot apply
# per-source here: the bonus is used when any of them is enabled.
apply_to_missiles = true
