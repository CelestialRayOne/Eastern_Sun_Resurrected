# Merc Death Recorder
#
# Diagnostic only: it changes nothing in the game. It writes to
# d2rloader/logs/celestialrayone.merc-death-recorder.log.
#
# What it records:
# - DEATH POSE: every time a hireling enters the death or dead pose. The
#   line shows her life, her owner record, her entry in the owner's
#   hireling list, her monster-mod bytes, the code that asked for the pose
#   (caller and call chain) and her last 16 mode changes.
#     RECORDED    the game had already marked her dead (a normal death).
#     MISSING     her entry was removed from the list (a pet removal).
#     UNRECORDED  her entry is still there and still alive. That is the bug:
#                 the caller and the chain name the code that killed her
#                 without telling the hireling list.
# - DEATH RECORD: the game marking a hireling dead (pet death notice).
# - PLAYER DEATH: a player death killing the player's pets.
# - HIT: her server life when she plays the get-hit or knockback pose, at
#   most once every hit_interval_frames frames (25 frames = 1 second).
# - LOADER DEATH EVENT: D2RLoader's own monster death event for a
#   hireling, with the killer.
#
# Addresses are written as module+offset: game+0x44DD01 is an address in
# the game image, D2RCore.dll+0x... is in D2RCore, any other name is a
# plugin.
#
# Console command: mercrec (counters and the last death of each hireling).

[merc_death_recorder]

# Master switch.
enabled = true

# Monster classes (monstats.txt hcIdx) treated as hirelings. The defaults
# are the classes hireling.txt uses: Rogue, Desert, Eastern, Barbarian x2.
hireling_classes = [271, 338, 359, 561, 562]

# Log her server life on get-hit and knockback.
log_hits = true

# Minimum frames between two HIT lines for the same hireling.
hit_interval_frames = 25

# How many stack slots to search for the call chain. More finds deeper
# callers; 192 covers the kill and death paths comfortably.
stack_scan_qwords = 192
