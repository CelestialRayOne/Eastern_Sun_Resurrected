# ---------------------------------------------------------------------------
# Triggers: tiers that come from boss kills, checked for every living player
# in the level when the boss dies.
#   monsters           monstats.txt ids (hcIdx)
#   difficulty         -1 any, 0 Normal, 1 Nightmare, 2 Hell
#   all_within_frames  every listed monster must die within this many frames,
#                      the player in the level each time and not dying between
#   lich_king = true   grants the Lich King bonus instead of a tier, when the
#                      monster's maxhp (256ths) is above min_maxhp
# ---------------------------------------------------------------------------

[[trigger]]
name = "Nihlathak, Hell"
tier = 2
monsters = [526]  # nihlathakboss
difficulty = 2

[[trigger]]
name = "Uber Tristram"
tier = 3
monsters = [705, 704, 709]  # uberdiablo, ubermephisto, uberbaal
difficulty = 2
all_within_frames = 1500

[[trigger]]
name = "Tier 5 map bosses"
tier = 5
# mephistotheinvincible, diablotheinvincible, baaltheinvincible, thelichking,
# korlictheeternal, talictheeternal, madawctheeternal, lucion, rathma
monsters = [973, 974, 972, 980, 978, 976, 977, 1085, 1068]

[[trigger]]
name = "The Lich King, players 8"
lich_king = true
monsters = [980]  # thelichking
min_maxhp = 2000000000

# ---------------------------------------------------------------------------
# Kill credit: what the Just Killed curses gave, for the Kill Ledger and
