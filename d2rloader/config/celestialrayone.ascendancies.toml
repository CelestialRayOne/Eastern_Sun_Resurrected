# Ascendancies
#
# The ascendancy system: an "Ascendancy" entry on the character sheet opens the
# Ascendancy window, one page per ascendancy (portrait, the five tiers, how to
# reach the next tier). After the Orb of Creation is consumed (orb_stat at 1 or
# more, set by the mod's softcode), Ascend picks the ascendancy on screen and
# grants tier 1. The other tiers come by themselves (see [[trigger]]), in any
# order. Renounce Ascendancy (with an "are you sure" step) takes the ascendancy,
# its tiers and bonuses away and sets orb_stat back to 0.
# A "New ascension tier unlocked" notice shows on the HUD for a few seconds after
# a new tier; its button opens the window.
#
# Needs D2RLoader 1.3.1, on the host and every client, the same version.
# Mouse and keyboard.
#
# How the bonuses work
#   The saved stats only say which ascendancy and which tiers. On the host the
#   plugin applies every unlocked tier's properties (below) to the character
#   with the game's own property code, the way monprop.txt applies monster
#   properties, into the stat list of bonus_state. Auras (aura-hidden) and
#   procs (hit-skill, gethit-skill, att-skill) work as they do from an item.
#   The list is rebuilt when a tier changes and after a resurrect. Nothing of it
#   is saved: it is built again in every game.
#
# itemstatcost.txt rows (ascendancy_stat, progress_stat, soulstone_stat, orb_stat)
#   - Saved = 1 and CSvBits above 0, CSvParam blank. Add new rows at the end of
#     the file. The plugin log reports this check every time the tables load.
#   - progress_stat: bit 0-4 = tiers 1-5, bit 5 = the Lich King bonus, bit 6 =
#     the character has ascended at least once (the sheet entry stays a -).
#
# Property format (tier1 to tier5, lich_king)
#   "code=value", "code[param]=value", "code=min..max", "code[param]=min..max":
#   code is a properties.txt code (or a propertygroups.txt code), param, min and
#   max are the cube row's mod param / mod min / mod max. "class-skills" is the
#   class skill property of the character's own class (class_skill_properties).
#
# Text format (text1 to text5, and every text setting)
#   "@d2r:Key" shows a string of the mod (any string file), plain text shows as
#   written. A leading ^ ("^@d2r:Key") marks an item tooltip string: its lines
#   are stored bottom-up, the window shows them top-down. Trailing note
#   markers (*, **) are dropped.
#
# Window layout (data/global/ui/layouts/celestialrayone.ascendancies/AscendancyPanelhd.json)
#   Built into the plugin; a mod can replace it. Every text in it must be a full
#   reference such as @d2r:Key. Widgets the plugin uses: Name, Portraits
#   (Portrait1 to PortraitN, one per [[ascendancy]], in order), the text columns
#   L and R (slots L1, L2, ... and R1, R2, ..., each with the text boxes HeadOn,
#   HeadOff, LineOn and LineOff), Footer, Action and ActionLabel, Confirm
#   (ConfirmLine1-3, ConfirmYes, ConfirmNo). The text column is the side
#   opposite image_side. A page's lines sit in the middle slots of its column.
#   Click messages, PanelManager:OpenPanel:<text>: AscendanciesOpen,
#   AscendanciesClose, AscendanciesPrevious, AscendanciesNext, AscendanciesAction,
#   AscendanciesYes, AscendanciesNo, AscendanciesNotice.
#
# Character sheet (characterstatspanelhd.json): AscendancyButton, a ButtonWidget
#   with the six frames of the Specialization button (+ then -), and
#   AscendancyTitle. Hidden until the orb is consumed.
# HUD (hudpanelhd.json): AscendancyNotice, with the button AscendancyNoticeButton.
#
# Old Ascendancy Stones
#   When a character with no ascendancy enters a game holding an Ascendancy
#   Stone (legacy_stone_item), the stone becomes the saved stats (the stone's
#   uniqueitems row picks the ascendancy, legacy_tier_stats the tiers) and is
#   removed. Once, by itself.
#
# Console command
#   ascendancies   status, the row check, your ascendancy and tiers, counters.

[ascendancies]

# Master switch.
enabled = true

# itemstatcost.txt rows of the saved stats.
ascendancy_stat = 1064
progress_stat = 1065
soulstone_stat = 1066
orb_stat = 1067

# states.txt row of the hidden state that holds the bonus list.
bonus_state = 697

# Primordial Soulstones: every one the character holds (inventory, cube,
# stash, cursor) goes into soulstone_stat, up to soulstone_cap. At the cap the
# character gets soulstone_tier, with no other tier needed (0: none).
soulstone_item = "u19"
soulstone_cap = 10
soulstone_tier = 4

# Renouncing always takes the ascendancy, its tiers and orb_stat. These take the
# soulstone count and the Lich King bonus too.
renounce_clears_soulstones = true
renounce_clears_lich_king = true

# The class skill property of each class, in charstats.txt class order.
class_skill_properties = ["ama", "sor", "nec", "pal", "bar", "dru", "ass", "war"]

# The Lich King bonus: these properties join the list once the character has
# earned it (see the lich_king trigger).
lich_king = ["lich-king-bonus=1"]

# Kill credit ([[kill_credit]]): kill_check_stat on a timed state, for this many
# frames (1500 = 60 seconds), as the Just Killed curses gave it.
kill_check_stat = 508
kill_credit_frames = 1500

# Old Ascendancy Stones: the item, and the stone's stats for tiers 2, 3, 4, 5,
# its soulstone count and the Lich King bonus.
legacy_stone_item = "ast"
legacy_tier_stats = [676, 677, 678, 680]
legacy_soulstone_stat = 919
legacy_lich_king_stat = 826

# Window texts. %d in tier_header is the tier; %d in a next_tier text is the
# soulstone count. next_tier is shown on the character's own page for the
# first tier not unlocked yet (tier 1 comes with Ascend).
tier_header = "@d2r:AscendancyTier"
next_tier = ["", "@d2r:AscendancyNextTier2", "@d2r:AscendancyNextTier3", "@d2r:AscendancyNextTier4", "@d2r:AscendancyNextTier5"]
# Shown in the same place once every tier is earned, until the Lich King bonus
# is earned too. "" shows nothing.
lich_king_tip = "@d2r:AscendancyLichKingTip"
ascend_label = "@d2r:AscendancyAscend"
renounce_label = "@d2r:AscendancyRenounce"
confirm_text = "@d2r:AscendancyConfirm"

# Seconds the "New ascension tier unlocked" notice stays (0: off).
notice_seconds = 5

# sounds.txt rows played on Ascend and on Renounce (the level-up sound).
ascend_sound = "cursor_stat_point_one_hd"
renounce_sound = "cursor_level_up"

# ---------------------------------------------------------------------------
# Ascendancies, in window order. The order is saved with every character
# (ascendancy_stat): never reorder or remove a block, add new ones at the end.
#   title         window title of the page
#   image_side    the portrait's side; the text takes the other one
#   legacy_unique uniqueitems.txt row of its old Ascendancy Stone
#   tier1..tier5  the properties of each tier
#   text1..text5  the lines of each tier in the window
# ---------------------------------------------------------------------------

