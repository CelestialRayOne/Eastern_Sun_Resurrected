# Stationary Auto Gold Pickup no-log release
# Distance/radius percentage (not area percentage).
# Vanilla game: 8
# Plugin default and maximum: 100
# Valid range: 1-100. Restart the game after changing this value.

[auto-gold-pickup]
range-percent = 15

# These values affect only neutral and casting modes. Walking and running keep
# the original AutoGold delays and action path.
stationary-just-dropped-delay-ms = 15
stationary-default-delay-ms = 5
direct-pickup-retry-cooldown-ms = 15
