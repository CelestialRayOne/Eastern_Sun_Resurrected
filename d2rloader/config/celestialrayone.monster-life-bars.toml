# Monster Life Bars
#
# Lets monsters and summons have more than 8,388,607 life, the most the
# game's 32-bit life stats can hold. Above the threshold below, a monster's
# life is split into equal bars:
#
#   the game's own life and max life hold the CURRENT bar
#   two hidden stats count the bars
#
#   total life = bars left x bar size + current bar
#   max life   = bars total x bar size
#
# Damage, poison, bleed, burn, heals, leech and regeneration keep working in
# real life on the current bar. When it empties the next bar fills it and the
# rest of the hit carries into it. The monster dies when the last bar empties.
# Monsters at or below the threshold are not touched at all.
#
# Covers: normal spawns, champion / unique / minion / Possessed life, the
# Herald boost, summons, Bind Demon (monpet.txt BoundStat / BoundCalc), and
# monsters in rooms that go to sleep and wake up again.
#
# What works per bar: effects that use a percent of life (Crushing Blow,
# Static Field), formulas reading stat('hitpoints') or stat('maxhp'), and
# natural monster regen. Heals and regen fill the current bar only. AI life
# thresholds and the health bar use total life. Monster Display 1.0.12 shows
# the exact totals.
#
# REQUIRED DATA: two itemstatcost.txt rows, one per hidden stat, both plain
# internal stats: no description, Send Bits 0, CSvBits 0, Save Bits 0,
# fCallback 0. Put their ids below. The plugin stays off until both rows
# exist. CSvBits must stay 0: a bound demon is rebuilt on load with full bars.
#
# Console: lifebars

# File format version. Leave this value unchanged.
version = 1

enabled = true

# itemstatcost.txt ids of the two hidden stats.
bars_total_stat = 924
bars_left_stat = 923

# Life above which a monster gets bars. 8388607 (the old limit) leaves every
# monster that already worked exactly as it was. Range 1000 to 8388607.
threshold = 8388607

# Largest life of one bar. Keep it under the threshold with headroom for
# percent max life bonuses (Battle Orders and the like), which multiply each
# bar. Range 1000 to the threshold.
bar_size = 4194304

# Base life above 32767. monstats.txt MinHP / MaxHP are 16-bit fields in the
# game's data, so 32767 is the most a row can hold and a bigger number wraps
# (500000 becomes -24288). List those monsters here instead:
#   [monstats row (hcIdx), normal, nightmare, hell]
# A value replaces both MinHP and MaxHP of that difficulty, before the level
# multiplier (monlvl.txt HP) is applied. 0 keeps what monstats.txt has.
# Example: [[812, 0, 0, 500000]] gives row 812 a base of 500000 in Hell.
base_life = [1068, 0, 0, 500000]