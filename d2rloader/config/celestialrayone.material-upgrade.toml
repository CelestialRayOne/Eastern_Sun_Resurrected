# celestialrayone.material-upgrade
#
# Material Upgrade
#   Shift + click on a material in the stash's stack tabs upgrades it in place,
#   Alt + click downgrades it.
#
# The clicks (stack tabs only, so the stash is open)
#   Shift + Left Click    one upgrade: 3 Chipped Amethyst become 1 Flawed
#                         Amethyst in the Flawed Amethyst slot.
#   Shift + Right Click   the whole stack, the remainder stays: 13 Chipped
#                         Amethyst become 4 Flawed Amethyst and 1 Chipped stays.
#   Alt + Left Click      one downgrade: 1 Wo Rune becomes 1 Nu Rune.
#   Alt + Right Click     the whole stack downgraded the same way.
#   - Results go straight into their own stack-tab slot; the cube is never
#     touched. A chain with output = "inventory" puts its results in the
#     inventory instead (the Randomizing Stone below).
#   - When the result's slot is full, only as many as fit are made. The limit
#     is D2RLoader's stack-tab limit, never a number from this file.
#   - The last item of a chain has nowhere to go. Shift + click (upgrades) or
#     Alt + click (downgrades) on it does nothing.
#   - Items that are in no chain keep the game's own clicks. Rejuvenation
#     Potions are in an upgrade chain, so in the stack tab Shift + click
#     upgrades them instead of moving them to the belt. Outside the stash it
#     still moves them to the belt. The game itself does nothing with Alt.
#   - With an item on the cursor every click does what the game does, and so
#     does Ctrl, or Shift and Alt together.
#
# On a controller
#   Hold A (Cross on PlayStation) on a stack-tab material: the whole stack
#   upgraded, the same as Shift + Right Click. Its prompt then reads
#     Pick Up (Hold to Make 4 Flawed Amethyst)
#   or, without enough items,
#     Pick Up (Hold to Make 1 Flawed Amethyst: Needs 3, Have 2)
#   The game's own hold on a stack-tab item is a quick move: to the belt for
#   rejuvenation potions, to the inventory for anything else (the same as X).
#   It is replaced only for items in an upgrade chain; a top tier then shows
#   plain "Pick Up" and holding it does nothing. Tap A, X and Y keep the
#   game's actions. Downgrades have no controller button: every button on a
#   stack-tab item is already taken.
#
# The hover text
#   An item that converts gets lines under its tooltip, for example on a
#   stack of 13 Chipped Amethyst:
#     Shift + Left Click to Make 1 Flawed Amethyst (Uses 3)
#     Shift + Right Click to Make 4 Flawed Amethyst (Uses 12)
#   and on a stack of 5 Wo Runes, which upgrade nowhere but downgrade:
#     Alt + Left Click to Make 1 Nu Rune (Uses 1)
#     Alt + Right Click to Make 5 Nu Rune (Uses 5)
#   A Right Click line only shows when at least 2 conversions are possible.
#   Without enough items there is one line instead:
#     Shift + Left Click to Make 1 Flawed Amethyst (Needs 3, Have 2)
#
#   Every text is a string Key, like any other string of the game:
#     MaterialUpgradeMakeOne              Shift + Left Click line
#     MaterialUpgradeMakeAll              Shift + Right Click line
#     MaterialUpgradeNotEnough            Shift line without enough items
#     MaterialUpgradeDowngradeOne         Alt + Left Click line
#     MaterialUpgradeDowngradeAll         Alt + Right Click line
#     MaterialUpgradeDowngradeNotEnough   Alt line without enough items
#     MaterialUpgradeHoldMake             the controller prompt's hold part
#     MaterialUpgradeHoldNotEnough        the same, without enough items
#     plus one Key per item that converts, set in the strings pairs below:
#     the name of what that item turns into, shown as {result}
#   The lines use the placeholders {made} {result} {used} {need} {have}.
#
#   The plugin carries all of these texts in 13 languages (strings.json,
#   built into the DLL). When one of the mod's own string files (ui.json,
#   item-names.json and the others) has an entry with the same Key, the mod's
#   entry is shown instead. So:
#   - to reword a text, add an entry with its Key to one of the mod's string
#     files, in every language, the way any other string is added
#   - for a new recipe, add an entry with a new Key the same way, and put that
#     Key in the recipe's strings pair
#   A color code in one of these texts colors the rest of its line.
#
# Recipes
#   [[chain]]      an upgrade chain, used by Shift
#   [[downgrade]]  a downgrade chain, used by Alt
#   Both take the same settings:
#   name     only for this file and the log
#   consume  how many of an item one conversion uses (1 to 999)
#   produce  how many of the next item it makes (1 to 999, default 1)
#   items    the chain in the order it converts: each item turns into the
#            next one, the last item has nowhere to go. Upgrade chains list
#            the lowest tier first, downgrade chains the highest first. A
#            chain that ends on its first item is a cycle (the Dragon Stone
#            forms).
#   strings  one { item = "...", key = "..." } pair for each item that
#            converts. item is the item the player hovers, key is the string
#            whose text names what that item turns into (the {result}).
#   output   where the results go (optional):
#              "stash"      their own stack-tab slot (the default)
#              "inventory"  the player's inventory, for results that cannot
#                           go in any stack tab. Each one needs a free spot
#                           there; a full inventory stops the conversion, and
#                           nothing is used for a result that did not fit.
#
#   The downgrades below:
#   - one for one: Runes Wo to I and Ancient Scrolls (the same as
#     cubemain.txt), Runes Zod to El, Ancient Decals, and Chipped Skull to
#     Randomizing Stone (into the inventory)
#   - gems (1 into 3) and crystals (1 into 5): the exact reverse of their
#     upgrades, so the total stays the same. 9 Chipped Amethyst upgrade to 3
#     Flawed Amethyst and then 1 Amethyst; that Amethyst downgrades to 3
#     Flawed Amethyst and then back to 9 Chipped Amethyst.
#   - Perfect gem 6 Packs (1 into 6): the exact reverse of their upgrade,
#     6 Perfect Amethyst into 1 Perfect Amethyst (6 Pack).
#   Maps and the other chains have none. Add a [[downgrade]] block to give
#   them one.
#
#   Checked when the plugin loads; anything broken is skipped and logged:
#   - item codes are misc, weapons or armor codes of up to 4 characters
#   - an item converts in one chain of each kind only: the first chain that
#     lists it as converting wins
#   - an item that converts without a strings pair shows its line with the
#     result's item code, and the log names it
#   The game still checks every conversion on the host: the item clicked
#   needs a stack-tab slot (AdvancedStashStackable = 1 and a slot in the
#   stash layout), and so does the result unless output = "inventory". The
#   stack must be the player's own.
#
# Stacks above 255
#   The game reads and lowers a stack-tab count as one byte in two places,
#   which breaks stacks of exactly 256, 512 and 768. The plugin fixes both
#   when it loads. The log and the console command say whether it did.
#
# TCP/IP games
#   The host needs this plugin too, same version.
#
# Changes are read when the plugin loads. Restart the game after editing.
# Built for D2RLoader 1.3.1 (Diablo II: Resurrected 3.3). On any other build
# the byte checks fail and the plugin loads without changing the game.
#
# Console command
#   materialupgrade   status, recipes loaded, controller, last requests

[material_upgrade]

# Master switch. false loads the plugin without touching the game.
enabled = true

# ---------------------------------------------------------------------------
# Upgrades (Shift)
# ---------------------------------------------------------------------------

