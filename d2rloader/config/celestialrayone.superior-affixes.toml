# Superior Affixes
#
# Picks the superior affix row (qualityitems.txt) of every Superior item the
# game creates by the row's frequency, and removes the stock row limit.
#
# ---------------------------------------------------------------------------
# What happens when an item rolls Superior
# ---------------------------------------------------------------------------
#   The server picks ONE qualityitems.txt row the item is allowed to use and
#   applies that row's mod1 and mod2 to the item. Each value is rolled once
#   between min and max and stored on the item as an ordinary stat, in the
#   same place as magic and rare affixes. Nothing ever re-reads
#   qualityitems.txt for that item afterwards.
#
#   Stock D2R gives every allowed row the same odds. This plugin gives each
#   row the odds of its frequency column (below). Without a frequency
#   column, every row has the same odds, exactly the stock ones.
#
# ---------------------------------------------------------------------------
# frequency column in qualityitems.txt
# ---------------------------------------------------------------------------
#   Works like frequency in magicprefix.txt and magicsuffix.txt: a row's
#   odds on a given item are its frequency divided by the sum of the
#   frequencies of every row that item may use.
#   - A whole number from 0 to 65535.
#   - 0 or an empty cell: the row never rolls.
#   - Anything else (text, a sign, a decimal point, more than 65535): the
#     row never rolls, and the log names the row and the cell.
#   - No frequency column in the file: every row has the same odds (stock).
#   Example: an item may use three rows, with frequency 100, 25 and 0. They
#   roll 80%, 20% and never.
#   If every row an item may use has frequency 0, the item drops as a
#   Normal item instead of Superior (the game's own fallback when no row
#   fits).
#
# ---------------------------------------------------------------------------
# Row limit
# ---------------------------------------------------------------------------
#   The stock picker remembers the rows it already tried in a 10-slot list.
#   With more than 10 rows it reads and writes past that list: rows 10 to
#   15 get skipped at random, and rows 16 and up can crash the game or
#   corrupt it silently. This plugin keeps no such list. qualityitems.txt
#   can have up to 65535 rows; rows past that are never picked, and the log
#   says so.
#
# ---------------------------------------------------------------------------
# Saves
# ---------------------------------------------------------------------------
#   Nothing in the save format changes, and existing characters and stashes
#   load exactly as before.
#   - The affixes are saved as ordinary item stats, as they always were.
#   - The item also saves which row it rolled, in a 3-bit field (0 to 7;
#     any higher row is written as 7). The game never reads that number back
#     for anything: the only code that turns a row number into affixes is
#     the picker itself, when the item is created. So a Superior item that
#     rolled row 200 keeps its row-200 affixes after a reload; only that
#     unused label says 7.
#
# ---------------------------------------------------------------------------
# Which rows an item may use (stock rules, unchanged by this plugin)
# ---------------------------------------------------------------------------
#   The columns test the item's OWN type, the "type" column of weapons.txt or
#   armor.txt, not its parent types:
#   - weapon: every weapon EXCEPT own type scep, wand, staf, bow, xbow. So
#     Amazon bows (abow), orbs, claws, Amazon spears and javelins, and
#     throwing weapons all use the weapon column.
#   - armor: every armor EXCEPT own type shie, boot, glov, belt. So Paladin
#     shields, Necromancer heads, helms, circlets, pelts and body armor all
#     use the armor column.
#   - shield, scepter, wand, staff, boots, gloves, belt: only items whose own
#     type is exactly shie, scep, wand, staf, boot, glov, belt.
#   - bow: own type exactly bow or xbow. Amazon bows (abow) do NOT count.
#   (The game checks these by itemtypes.txt row position. The codes above
#   are the vanilla rows at those positions.)
#
#   mod2 is applied only when mod1code is filled in. A row with an empty
#   mod1code still makes the item Superior, with no bonus at all.
#
# ---------------------------------------------------------------------------
# Rows are numbered from 0
# ---------------------------------------------------------------------------
#   The console command and the log name rows by number. Row 0 is the first
#   line under the header of qualityitems.txt, row 1 the second, and so on.
#
# ---------------------------------------------------------------------------
# Item-type columns in qualityitems.txt (optional, no setting needed)
# ---------------------------------------------------------------------------
#   Add any of these columns to qualityitems.txt:
#     itype1 itype2 itype3 itype4 itype5 itype6 itype7
#     etype1 etype2 etype3 etype4 etype5
#   They take itemtypes.txt codes and work exactly like the same columns of
#   magicprefix.txt: an item matches a code when its type, or its type2, is
#   that type or any type below it in itemtypes.txt (Equiv1/Equiv2).
#   - A row with any itype filled rolls only on items matching one of its
#     itypes; its armor..belt columns are then ignored.
#   - A row with no itype keeps the armor..belt columns.
#   - etype always excludes: a row never rolls on an item matching one of its
#     etypes, whichever way the row includes items.
#   Example, spears only, without Amazon spears: itype1 = spea, etype1 = aspe.
#   Example, every weapon the weapon column allows except spears:
#     weapon = 1, etype1 = spea.
#   An unknown code is skipped, and the log names its row and column. A row
#   whose itypes are all unknown never rolls.
#
# ---------------------------------------------------------------------------
# How the plugin reads the frequency, itype and etype columns
# ---------------------------------------------------------------------------
#   The game itself skips columns it does not know, so the file stays valid.
#   The plugin reads the same file the game loaded and, before using it,
#   checks it row by row against what the game loaded (row count, the ten
#   item-class columns and every mod param/min/max). If anything differs,
#   the log says exactly where, and none of these columns are used for that
#   table: every row has the same odds and the armor..belt columns decide.
#   Console command superior shows the result.
#
# Console command: superior (status, rows seen, items made, rolls per row)

[superior_affixes]

# Master switch. false installs nothing: the stock picker runs, with its
# 10-row limit, and the frequency, itype and etype columns are not used.
enabled = true

# Stock rule: items whose own type has Throwable = 1 in itemtypes.txt, and
# items with nodurability = 1 in weapons.txt or armor.txt, only ever look at
# rows 0 to 3. true keeps the stock behaviour. false lets them use every row,
# by the same rules and frequencies as any other item.
first_four_rows_for_throwing_and_nodurability = false
