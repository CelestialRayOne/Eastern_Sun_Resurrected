<style>
:root{
  --bg:#16120e; --panel:#1f1a14; --panel2:#272019; --rule:#3d3327;
  --ink:#ded3bc; --dim:#9a8d76; --faint:#6b6152;
  --gold:#d0a75f; --azure:#7a8fd8; --rust:#b4603f;
  --q-unique:#c7b377; --q-set:#3cc23c; --q-rare:#e6d34d; --q-magic:#7b88ff; --q-white:#d6d6d6; --q-low:#8a8a8a;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --body:'Inter',system-ui,sans-serif;
  --disp:'IM Fell English SC',Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:radial-gradient(ellipse 120% 80% at 50% -10%,#241d16 0%,transparent 60%);min-height:100vh}
.wrap{max-width:1320px;margin:0 auto;padding:40px 24px 72px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 0 28px 0;flex-wrap:wrap}
.backbtn{display:inline-flex;align-items:center;gap:12px;font-family:var(--disp);font-size:20px;letter-spacing:1px;color:var(--gold);
  text-decoration:none;padding:16px 28px;border:1px solid var(--rule);border-radius:10px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));box-shadow:0 2px 12px rgba(0,0,0,.35),inset 0 0 30px rgba(120,70,20,.10)}
.backbtn:hover{color:#f0c67e;border-color:var(--gold)}
.esr-lang select{width:auto}
header{border-bottom:1px solid var(--rule);padding-bottom:22px;margin-bottom:30px}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--faint)}
h1{font-family:var(--disp);font-size:clamp(30px,5vw,46px);font-weight:400;margin:.18em 0 .1em;letter-spacing:.01em}
.sub{color:var(--dim);max-width:70ch;font-size:14px}
.grid{display:grid;grid-template-columns:330px 1fr;gap:30px;align-items:start}
@media(max-width:960px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:3px}
.panel>h2{font-family:var(--mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:0;
  padding:13px 16px;border-bottom:1px solid var(--rule);font-weight:600;display:flex;align-items:center;gap:10px}
.pad{padding:16px}
label,.lbl{display:block;font-size:12px;color:var(--dim);margin:0 0 5px;letter-spacing:.02em}
.field{position:relative}
.field+.field{margin-top:14px}
select,input{width:100%;background:var(--panel2);color:var(--ink);border:1px solid var(--rule);border-radius:2px;padding:8px 9px;font-family:var(--mono);font-size:13px}
select:focus,input:focus{outline:2px solid var(--azure);outline-offset:1px;border-color:transparent}
input:disabled{opacity:.45;cursor:not-allowed}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:11px;color:var(--faint);margin-top:5px;line-height:1.45}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{flex:1 1 auto;background:var(--panel2);color:var(--dim);border:1px solid var(--rule);border-radius:2px;padding:7px 8px;
  font-family:var(--mono);font-size:12px;cursor:pointer}
.seg button.on{color:var(--bg);background:var(--gold);border-color:var(--gold)}
.seg button:disabled{opacity:.3;cursor:not-allowed}
.sep{border-top:1px solid var(--rule);margin:18px -16px 16px}
.cwrap{position:relative;display:block}
  .cwrap input{padding-right:32px}
  .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:24px;height:24px;padding:0;border:0;background:none;
    color:var(--dim);font-size:18px;line-height:24px;text-align:center;cursor:pointer}
  .clr:hover{color:var(--gold)}
  input:placeholder-shown+.clr,input:disabled+.clr{display:none}
  .dd{position:absolute;left:0;right:0;top:100%;z-index:50;background:var(--panel2);border:1px solid var(--rule);max-height:320px;overflow:auto;
  box-shadow:0 8px 24px rgba(0,0,0,.5);display:none}
.dd.open{display:block}
.dd div{padding:6px 9px;cursor:pointer;font-size:13px;border-bottom:1px solid rgba(61,51,39,.5)}
.dd div.hl,.dd div:hover{background:#3a2f22}
.dd small{display:block;color:var(--faint);font-size:11px}
.results .panel>h2 .back{margin-left:auto}
.crumbs{font-family:var(--mono);font-size:12px;color:var(--faint);padding:10px 16px;border-bottom:1px solid var(--rule);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumbs button{background:none;border:1px solid var(--rule);color:var(--gold);border-radius:2px;padding:3px 10px;cursor:pointer;font-family:var(--mono)}
.crumbs button:disabled{opacity:.3;cursor:default}
.crumbs .cur{color:var(--ink)}
.filters{display:flex;gap:10px;padding:12px 16px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.filters .field{flex:1 1 160px;margin:0}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:13px}
thead th{text-align:left;font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:9px 12px;
  border-bottom:1px solid var(--rule);white-space:nowrap;cursor:pointer;user-select:none}
thead th.num{text-align:right}
thead th .arr{color:var(--gold)}
thead tr.search th{padding:6px 12px;cursor:default}
thead tr.search input{padding:5px 7px;font-size:12px}
tbody td{padding:7px 12px;border-bottom:1px solid rgba(61,51,39,.55);vertical-align:top}
tbody td.num{text-align:right;white-space:nowrap}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:rgba(208,167,95,.06)}
tbody tr.child td{background:rgba(0,0,0,.18);font-size:12px}
td small{display:block;color:var(--faint);font-size:11px}
.q-unique,.q-quest{color:var(--q-unique)}.q-set{color:var(--q-set)}.q-rare{color:var(--q-rare)}.q-magic{color:var(--q-magic)}
.q-superior,.q-normal,.q-item{color:var(--q-white)}.q-low{color:var(--q-low)}.q-gold{color:var(--gold)}
.badge{display:inline-block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim);border:1px solid var(--rule);
  border-radius:2px;padding:0 5px;margin-left:6px}
.empty{padding:28px 16px;color:var(--faint);text-align:center}
.tog{color:var(--gold);margin-right:6px;display:inline-block;width:10px}
.note{font-size:11px;color:var(--faint);padding:10px 16px}
</style>
</head>

const zoneOpts=()=>{const o=[{v:-1,label:U.dfAnyZone,s:norm(U.dfAnyZone)}];ZON.forEach((z,i)=>{if([2,3,4].some(c=>z[c][S.d].length))o.push({v:i,label:zoneLabel[i],sub:N.acts[z[0]],s:norm(zoneLabel[i]+' '+N.acts[z[0]])});});return o;};
const monOpts=()=>{let keys;if(S.z>=0)keys=zoneMons(S.z,S.d);else{keys=[];MONS.forEach((m,i)=>{if(m[5])keys.push('m'+i);});SUP.forEach((s,i)=>keys.push('s'+i));}
  return keys.map(k=>({v:k,label:monLabel.get(k),sub:k[0]==='s'?U.dfSuperUnique:'',cls:k[0]==='s'?'q-unique':'',s:norm(monLabel.get(k))})).sort((a,b)=>a.label.localeCompare(b.label,LOC));};
let ITEMROWS=null;
function itemRows(){if(ITEMROWS)return ITEMROWS;const bits=new Uint32Array(Math.ceil(ITEMS.length/32)+1);
  const addTC=t=>{if(t>=0){const r=E.reachBits(t);for(let i=0;i<bits.length;i++)bits[i]|=r[i];}};
  MONS.forEach(m=>{if(m[5])m[3].forEach(d=>d.forEach(addTC));});SUP.forEach(s=>{s[1].forEach(addTC);s[2].forEach(addTC);});
  const rows=new Set();for(let b=0;b<ITEMS.length;b++){if(!(bits[b>>5]&(1<<(b&31))))continue;const it=ITEMS[b],T=TYPES[it[0]];
    if(b===D.goldItem){rows.add('g');continue;}if(T[2]&1){rows.add('i'+b);continue;}if(T[2]&16){rows.add('q'+b);continue;}
    (E.uniByItem.get(b)||[]).forEach(u=>{if(UNI[u][3]&2)rows.add('u'+u);});(E.setByItem.get(b)||[]).forEach(s=>rows.add('s'+s));
    if(it[3]&2)continue;if(T[2]&4)rows.add('r'+it[0]);rows.add('m'+it[0]);if(!(T[2]&2)){rows.add('h'+it[0]);rows.add('n'+it[0]);rows.add('l'+it[0]);}}
  ITEMROWS=[...rows].map(k=>({v:k,label:rowName(k),sub:rowSub(k),cls:'q-'+rowQ(k),s:rowSearch(k)})).sort((a,b)=>a.label.localeCompare(b.label,LOC));return ITEMROWS;}
combo($('zone'),$('zone-dd'),zoneOpts,v=>{const mk=S.m&&S.m[0]==='m'&&v>=0&&!zoneMons(v,S.d).includes(S.m)?'':S.m;go({z:v,m:mk,v:mk?'drops':S.v});},()=>{if(S.z>=0)go({z:-1});else syncInputs();});
combo($('mon'),$('mon-dd'),monOpts,v=>{const ts=monTypes(v,v[0]==='s'?-1:S.z,S.d);go({m:v,z:v[0]==='s'?-1:S.z,t:ts.includes(S.t)?S.t:(ts[0]||0),v:'drops'});},()=>{if(S.m)go({m:''});else syncInputs();});
combo($('item'),$('item-dd'),()=>itemRows(),v=>go({i:v,v:'who'}),()=>{if(S.i)go({i:''});else syncInputs();});
$('diff').onchange=()=>go({d:+$('diff').value});$('players').onchange=()=>go({p:+$('players').value});
$('mf').onchange=()=>go({mf:Math.trunc(+$('mf').value)||0});$('iq').onchange=()=>go({iq:Math.max(0,Math.trunc(+$('iq').value)||0)});
function seg(el,labels,val,dis,on){el.innerHTML='';labels.forEach((l,i)=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.className=i===val?'on':'';b.disabled=dis(i);b.onclick=()=>on(i);el.appendChild(b);});}
function syncInputs(){
  $('diff').value=S.d;$('players').value=S.p;$('mf').value=S.mf;$('iq').value=S.iq;
  const sup=S.m&&S.m[0]==='s',zoneless=S.m&&(sup||!inZone.has(+S.m.slice(1)));
  $('zone').disabled=!!zoneless;$('zone').value=zoneless?U.dfNoZone:S.z>=0?zoneLabel[S.z]:'';
  $('mon').value=S.m?monLabel.get(S.m)||'':'';$('item').value=S.i?rowName(S.i):'';
  const ts=S.m?monTypes(S.m,sup?-1:S.z,S.d):[0,1,2,3];
  $('typewrap').style.display=sup?'none':'';seg($('type'),TYPEL,S.t,i=>!ts.includes(i),i=>go({t:i}));
  seg($('terror'),[U.dfTerrorNone,U.dfTerrorized,U.dfHerald],S.x,()=>false,i=>go({x:i}));
}
// ---- tables
function table(cols,rows,opt){
  // cols: [{k,label,num,search,sort}] rows: [{cells:{},sort:{},search:{},cls,onclick,children}]
  const st=opt.state;const wrap=document.createElement('div');
  const filt=rows.filter(r=>cols.every(c=>!c.search||!st.q[c.k]||r.search[c.k].includes(norm(st.q[c.k])))&&(!opt.filter||opt.filter(r)));
  const sc=cols.find(c=>c.k===st.sort)||cols[0],dir=st.dir;
  filt.sort((a,b)=>{const x=a.sort[sc.k],y=b.sort[sc.k];const r=typeof x==='number'?x-y:String(x).localeCompare(String(y),LOC);return dir*r||String(a.sort.name||'').localeCompare(String(b.sort.name||''),LOC);});
  let h='<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th data-k="'+c.k+'" class="'+(c.num?'num':'')+'">'+esc(c.label)+(c.k===st.sort?' <span class="arr">'+(dir<0?'&#9660;':'&#9650;')+'</span>':'')+'</th>').join('')+'</tr>';
  if(cols.some(c=>c.search))h+='<tr class="search">'+cols.map(c=>'<th>'+(c.search?'<input data-q="'+c.k+'" placeholder="'+esc(U.dfSearch)+'" value="'+esc(st.q[c.k]||'')+'">':'')+'</th>').join('')+'</tr>';
  h+='</thead><tbody>';
  const max=600;filt.slice(0,max).forEach((r,ri)=>{const open=st.open.has(r.id);
    h+='<tr class="'+(r.onclick?'click':'')+'" data-r="'+ri+'">'+cols.map((c,ci)=>'<td class="'+(c.num?'num':'')+'">'+(ci===0&&r.children&&r.children.length>1?'<span class="tog" data-t="'+ri+'">'+(open?'&#9662;':'&#9656;')+'</span>':'')+r.cells[c.k]+'</td>').join('')+'</tr>';
    if(open&&r.children)r.children.forEach((ch,chi)=>{h+='<tr class="child click" data-r="'+ri+'" data-c="'+chi+'">'+cols.map(c=>'<td class="'+(c.num?'num':'')+'">'+(ch.cells[c.k]||'')+'</td>').join('')+'</tr>';});});
  if(!filt.length)h+='<tr><td colspan="'+cols.length+'" class="empty">'+esc(U.dfNoResults)+'</td></tr>';
  h+='</tbody></table></div>';wrap.innerHTML=h;
  wrap.querySelectorAll('th[data-k]').forEach(th=>th.onclick=()=>{const k=th.dataset.k;if(st.sort===k)st.dir=-st.dir;else{st.sort=k;st.dir=cols.find(c=>c.k===k).num?-1:1;}opt.redraw();});
  wrap.querySelectorAll('input[data-q]').forEach(inp=>inp.oninput=()=>{st.q[inp.dataset.q]=inp.value;const pos=inp.selectionStart;opt.redraw();const n=document.querySelector('input[data-q="'+inp.dataset.q+'"]');if(n){n.focus();n.setSelectionRange(pos,pos);}});
  wrap.querySelectorAll('tbody tr[data-r]').forEach(tr=>tr.onclick=e=>{const r=filt[+tr.dataset.r];if(e.target.dataset.t!==undefined){if(st.open.has(r.id))st.open.delete(r.id);else st.open.add(r.id);opt.redraw();return;}
    if(tr.dataset.c!==undefined){const ch=r.children[+tr.dataset.c];if(ch.onclick)ch.onclick();}else if(r.onclick)r.onclick();});
  return wrap;
}
const TST={drops:{sort:'chance',dir:-1,q:{},open:new Set(),qf:'',tf:-1},who:{sort:'chance',dir:-1,q:{},open:new Set(),df:-1,af:-1,tf:-1}};
function selectField(label,opts,val,on){const f=document.createElement('div');f.className='field';const l=document.createElement('label');l.textContent=label;const s=document.createElement('select');
  opts.forEach(([v,t])=>s.add(new Option(t,v)));s.value=val;s.onchange=()=>on(s.value);f.append(l,s);return f;}
function typeFilterOpts(rows){const seen=new Set();rows.forEach(r=>typeChain(r.ti).forEach(t=>seen.add(t)));return[[-1,U.dfAll]].concat([...seen].map(t=>[t,N.types[t]]).sort((a,b)=>String(a[1]).localeCompare(String(b[1]),LOC)));}
function dropsView(){
  const v={k:S.m[0],i:+S.m.slice(1),d:S.d,t:S.t,x:S.x,z:S.m[0]==='s'?-1:S.z};
  if(v.k==='m'&&v.z<0&&inZone.has(v.i)){} 
  const r=E.resolve(v);const main=r.tc>=0?E.topMap(r.tc,r.c,r.pe):new Map(),quest=r.qtc>=0?E.topMap(r.qtc,r.c,r.pe):null;
  if(r.tc<0&&r.qtc<0){const b=document.createElement('div');b.className='empty';b.textContent=U.dfNoTC;return b;}
  $('levelnote').textContent=r.approx||(v.k==='m'&&v.z<0&&inZone.has(v.i))?U.dfLevelNote:'';
  const keys=new Set([...main.keys()].concat(quest?[...quest.keys()]:[]));
  const rows=[...keys].map(k=>{const q=rowQ(k),name=rowName(k),sub=rowSub(k),a=main.get(k)||0,b=quest?quest.get(k)||0:0;
    return{id:k,ti:rowType(k),q,cells:{name:'<span class="q-'+q+'">'+esc(name)+'</span>'+(sub?'<small>'+esc(sub)+'</small>':''),chance:pct(a),quest:pct(b)},
      sort:{name,chance:a,quest:b},search:{name:rowSearch(k)},onclick:()=>go({i:k,v:'who'})};});
  const st=TST.drops,cols=[{k:'name',label:U.dfColItem,search:true},{k:'chance',label:U.dfColChance,num:true}];if(quest)cols.push({k:'quest',label:U.dfColQuest,num:true});
  const box=document.createElement('div');
  const redraw=()=>{box.innerHTML='';const f=document.createElement('div');f.className='filters';
    f.append(selectField(U.dfFilterQuality,[['',U.dfAll],['unique',U.dfQUnique],['set',U.dfQSet],['rare',U.dfQRare],['magic',U.dfQMagic]],st.qf,x=>{st.qf=x;redraw();}),
      selectField(U.dfFilterType,typeFilterOpts(rows),st.tf,x=>{st.tf=+x;redraw();}));
    box.append(f,table(cols,rows,{state:st,redraw,filter:r=>(!st.qf||r.q===st.qf)&&(st.tf<0||typeChain(r.ti).includes(st.tf))}));};
  redraw();return box;
}
function whoView(){
  const R=S.i,B=E.basesOf(R),groups=new Map();
  const consider=(k,i,t,d,z)=>{const r=E.resolve({k,i,d,t,x:S.x,z});const a=E.top1(r.tc,r.c,r.pe,R,B),b=E.top1(r.qtc,r.c,r.pe,R,B);if(a<=0&&b<=0)return;
    const id=k+i+'|'+t+'|'+d;let g=groups.get(id);if(!g)groups.set(id,g={k,i,t,d,list:[]});g.list.push({z,a,b});};
  for(let d=0;d<3;d++){ZON.forEach((Z,z)=>{const seen=new Map();[2,3,4].forEach((c,ci)=>Z[c][d].forEach(m=>{const ts=ci===0?[0]:ci===1?[1,2]:[3];ts.forEach(t=>{const key=m+'|'+t;if(!seen.has(key)){seen.set(key,1);consider('m',m,t,d,z);}});}));});
    MONS.forEach((m,i)=>{if(m[5]&&!inZone.has(i))consider('m',i,0,d,-1);});SUP.forEach((s,i)=>consider('s',i,0,d,-1));}
  const rows=[...groups.values()].map(g=>{g.list.sort((x,y)=>y.a-x.a||y.b-x.b);const best=g.list[0],mk=g.k+g.i,name=monLabel.get(mk)||'',tl=g.k==='s'?U.dfSuperUnique:TYPEL[g.t];
    const zn=z=>z>=0?zoneLabel[z]:U.dfNoZone;const act=g.list.map(e=>e.z>=0?ZON[e.z][0]:-1);
    const zcell=g.list.length>1?esc(zn(best.z))+'<small>'+esc(fmt(U.dfZoneCount,g.list.length))+'</small>':esc(zn(best.z));
    const open=z=>()=>go({m:mk,z:g.k==='s'?-1:z,t:g.t,d:g.d,v:'drops'});
    return{id:mk+'|'+g.t+'|'+g.d,acts:act,t:g.k==='s'?4:g.t,d:g.d,cells:{name:'<span class="'+(g.k==='s'?'q-unique':'')+'">'+esc(name)+'</span><span class="badge">'+esc(tl)+'</span>',zone:zcell,diff:esc(DIFFS[g.d]),chance:pct(best.a),quest:pct(best.b)},
      sort:{name,zone:zn(best.z),diff:g.d,chance:best.a,quest:best.b},search:{name:norm(name+' '+tl),zone:norm(g.list.map(e=>zn(e.z)).join(' '))},onclick:open(best.z),
      children:g.list.map(e=>({cells:{name:'',zone:esc(zn(e.z)),diff:'',chance:pct(e.a),quest:pct(e.b)},onclick:open(e.z)}))};});
  const st=TST.who,anyQ=rows.some(r=>r.sort.quest>0);
  const cols=[{k:'name',label:U.dfColMonster,search:true},{k:'zone',label:U.dfColZone,search:true},{k:'diff',label:U.dfColDifficulty},{k:'chance',label:U.dfColChance,num:true}];if(anyQ)cols.push({k:'quest',label:U.dfColQuest,num:true});
  const box=document.createElement('div');
  const redraw=()=>{box.innerHTML='';const f=document.createElement('div');f.className='filters';
    f.append(selectField(U.dfDifficulty,[[-1,U.dfAll]].concat(DIFFS.map((n,i)=>[i,n])),st.df,x=>{st.df=+x;redraw();}),
      selectField(U.dfAct,[[-1,U.dfAll]].concat(N.acts.map((n,i)=>[i,n])),st.af,x=>{st.af=+x;redraw();}),
      selectField(U.dfMonsterType,[[-1,U.dfAll]].concat(TYPEL.map((n,i)=>[i,n])).concat([[4,U.dfSuperUnique]]),st.tf,x=>{st.tf=+x;redraw();}));
    box.append(f,table(cols,rows,{state:st,redraw,filter:r=>(st.df<0||r.d===st.df)&&(st.af<0||r.acts.includes(st.af))&&(st.tf<0||r.t===st.tf)}));};
  redraw();return box;
}
function render(){
  E.setEnv({players:S.p,mf:S.mf,iq:S.iq});syncInputs();
  const view=$('view');view.innerHTML='';$('backbtn').disabled=trail.length<2;
  const mode=S.v==='who'&&S.i?'who':S.v==='drops'&&S.m?'drops':S.i?'who':S.m?'drops':'';
  const crumbs=[];if(S.m)crumbs.push(monLabel.get(S.m));if(S.i)crumbs.push(rowName(S.i));$('crumbtext').textContent=crumbs.join('  ›  ');
  if(mode==='drops'){$('viewtitle').textContent=fmt(U.dfDropsTitle,monLabel.get(S.m));view.append(dropsView());}
  else if(mode==='who'){$('viewtitle').textContent=fmt(U.dfWhoTitle,rowName(S.i));view.innerHTML='<div class="empty">'+esc(U.dfCalculating)+'</div>';
    setTimeout(()=>{view.innerHTML='';view.append(whoView());},10);}
  else{$('viewtitle').textContent=U.dfTitle;view.innerHTML='<div class="empty">'+esc(U.dfEmpty)+'</div>';}
  const n=document.createElement('div');n.className='note';n.textContent=U.dfNote;view.append(n);
}
trail.push(location.hash||'');S=fromHash(location.hash);render();
})();
</script>
